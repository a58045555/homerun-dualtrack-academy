name: Preview official Zhuyin audio at 0.80x
on:
  push:
    branches:
      - test/moe-zhuyin-standard-audio
permissions:
  contents: write
jobs:
  create-mp3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout preview branch only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: test/moe-zhuyin-standard-audio
          persist-credentials: true
      - name: Install audio processing tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --user --disable-pip-version-check pydub==0.25.1
      - name: Process pristine official source WAVs at pitch-preserved 0.80 tempo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 65 \
            'https://language.moe.gov.tw/001/Upload/files/site_content/M0001/juyin/bopomofo_materials_20170213.zip' \
            -o /tmp/official-zhuyin.zip
          curl --fail --location --silent --show-error --retry 2 --max-time 45 \
            'https://language.moe.gov.tw/001/Upload/files/site_content/M0001/juyin/html_ch/index.html' \
            -o /tmp/official-index.html
          python3 - <<'PY'
          from pathlib import Path
          from pydub import AudioSegment
          from pydub.silence import detect_nonsilent
          import re, zipfile, tempfile, subprocess, json

          spelling='b p m f d t n l g k h j q x zh ch sh r z c s i u yu a o e eh ai ei ao ou an en ang eng er'.split()
          signs='ㄅ ㄆ ㄇ ㄈ ㄉ ㄊ ㄋ ㄌ ㄍ ㄎ ㄏ ㄐ ㄑ ㄒ ㄓ ㄔ ㄕ ㄖ ㄗ ㄘ ㄙ ㄧ ㄨ ㄩ ㄚ ㄛ ㄜ ㄝ ㄞ ㄟ ㄠ ㄡ ㄢ ㄣ ㄤ ㄥ ㄦ'.split()
          assert len(signs)==len(spelling)==37
          codes=dict(zip(signs,spelling))

          html=Path('/tmp/official-index.html').read_text(encoding='utf-8')
          rows=re.findall(r'<tr>\s*<td class="yellow" id="s\d+"[\s\S]*?</tr>',html,re.I)
          official_ids={}
          for row in rows:
              key=re.search(r"play\('a(\d+)'\)",row)
              glyph=re.search(r"zhStroker\('app',\s*'([\u3105-\u3129])'\)",row)
              if key and glyph:
                  number=int(key.group(1))
                  official_ids[number]=glyph.group(1)
          assert len(official_ids)==37 and set(official_ids.values())==set(signs),official_ids

          folder=Path('audio/zhuyin')
          existing={p.name for p in folder.glob('*.mp3')}
          assert existing=={f'{name}.mp3' for name in spelling}, existing
          with zipfile.ZipFile('/tmp/official-zhuyin.zip') as zipdata:
              originals={p:zipdata.read(p) for p in zipdata.namelist()
                          if re.fullmatch(r'audio/F\d+\.WAV',p)}
              assert len(originals)==37

              with tempfile.TemporaryDirectory() as td:
                  td=Path(td)
                  for i,glyph in sorted(official_ids.items()):
                      src=td/'source.wav'
                      src.write_bytes(originals[f'audio/F{i}.WAV'])
                      original=AudioSegment.from_wav(src).set_channels(1)
                      assert original.dBFS != float('-inf'),glyph
                      quiet=max(-49,original.dBFS-28)
                      spans=detect_nonsilent(original,min_silence_len=75,silence_thresh=quiet,seek_step=4)
                      assert spans, glyph
                      begin=max(0,spans[0][0]-65)
                      end=min(len(original),spans[-1][1]+95)
                      clip=original[begin:end]
                      assert 200 <= len(clip) <= 1900, (glyph,len(clip))
                      pcm=td/'trimmed.wav'
                      clip.export(pcm,format='wav')

                      dest=folder/(codes[glyph]+'.mp3')
                      temporary=td/'output.mp3'
                      tags=[
                        '-metadata', f'title=注音符號 {glyph}',
                        '-metadata', 'artist=教育部（中華民國臺灣）',
                        '-metadata', 'comment=改作自教育部《國語注音符號手冊》官方WAV；轉成MP3、移除首尾靜音，並保留音高以0.80倍速播放。原作CC BY 4.0。來源 https://language.moe.gov.tw/001/Upload/files/site_content/M0001/juyin/'
                      ]
                      subprocess.run([
                        'ffmpeg','-nostdin','-hide_banner','-loglevel','error','-y',
                        '-i',str(pcm),'-af','atempo=0.80',
                        '-ac','1','-ar','24000','-c:a','libmp3lame','-b:a','96k',
                        '-id3v2_version','3',*tags,str(temporary)],check=True)
                      probe=json.loads(subprocess.check_output([
                        'ffprobe','-v','error','-show_entries','format=duration:stream=codec_name',
                        '-of','json',str(temporary)]))
                      length=float(probe['format']['duration'])
                      assert {s['codec_name'] for s in probe['streams']}=={'mp3'}
                      assert 0.75 <= length <= 1.55, (glyph,length)
                      assert temporary.stat().st_size>1500
                      dest.write_bytes(temporary.read_bytes())
                      print(f'{glyph} {dest.name}: {length:.3f}s 80%-speed, no pitch shift',flush=True)

          final={p.name for p in folder.glob('*.mp3')}
          assert final=={f'{name}.mp3' for name in spelling}
          print('Verified all 37 official audio recordings: 0.80x tempo, pitch stable, no other assets changed.')
          PY
      - name: Commit only 37 audio updates and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- audio/zhuyin/
          git rm -- .github/workflows/_zhuyin_080_once.yml
          python3 - <<'PY'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())
          names='b p m f d t n l g k h j q x zh ch sh r z c s i u yu a o e eh ai ei ao ou an en ang eng er'.split()
          expected={f'audio/zhuyin/{name}.mp3' for name in names}
          expected.add('.github/workflows/_zhuyin_080_once.yml')
          assert staged==expected,staged ^ expected
          print('Staged only 37 MP3 and temporary self-cleaning workflow')
          PY
          git commit -m "Audio preview: regenerate 37 official Zhuyin clips at 0.80x speed"
          git push origin HEAD:test/moe-zhuyin-standard-audio
