function bankQuestionFrom(item,skill,prompt,sig,reason=true){return {skill,prompt,main:item.q,answer:item.a,choices:shuffle(item.o),explain:item.e,hint:item.h||'先把每個選項想一遍，刪掉一定不對的，再從剩下的選。',signature:sig,concept:sig,reason}}
function pickBank(bank,lv,used,prefix){const tagged=bank.map((x,i)=>({x,i,sig:prefix+'-'+i}));const fresh=tagged.filter(t=>!used.has(t.sig)&&t.x.l<=lv);const same=fresh.filter(t=>t.x.l===lv);return one(same.length?same:fresh.length?fresh:tagged.filter(t=>t.x.l<=lv))}
function bankPoolSize(sub,m,lv){if(sub==='logic'){if(m==='odd')return ODD_BANK.filter(x=>x.l<=lv).length;if(m==='rules')return RULES_BANK.filter(x=>x.l<=lv).length;return 8}if(m==='mix')return 8;return (SCIENCE_BANK[m]||[]).filter(x=>x.l<=lv).length}
function logicQuestion(lv,m,used){
 if(m==='lineup')return lineupQuestion(lv);
 if(m==='lpattern')return logicPatternQuestion(lv);
 if(m==='odd'){const t=pickBank(ODD_BANK,lv,used,'odd');return bankQuestionFrom(t.x,'logic-classify','🔍 找出不同類的一個，想想分類的理由',t.sig,false)}
 const t=pickBank(RULES_BANK,lv,used,'rules');return bankQuestionFrom(t.x,'logic-rule','⚖️ 讀懂規則，再判斷結果',t.sig,true);
}
const SCI_PROMPT={body:'💪 運動與身體的科學',force:'🚀 球場上的力與運動',nature:'⛅ 天氣與自然觀察',lab:'🧪 像科學家一樣思考'};
function scienceQuestion(lv,m,used){const area=m==='mix'?one(['body','force','nature','lab']):m;const t=pickBank(SCIENCE_BANK[area],lv,used,'sci-'+area);return bankQuestionFrom(t.x,'sci-'+area,SCI_PROMPT[area],t.sig,true)}
function generateNewSubjectRound(sub,m,lv){const size=Math.min(8,bankPoolSize(sub,m,lv)),list=[],used=new Set();
 for(let i=0;i<size;i++){let q,k=0;do{q=sub==='logic'?logicQuestion(lv,m,used):scienceQuestion(lv,m,used);k++}while(used.has(q.signature)&&k<60);used.add(q.signature);list.push(q)}return list}
function freshNewSubjectReview(item){if(item.subject==='logic'&&item.mode==='lineup')return lineupQuestion(item.level);if(item.subject==='logic'&&item.mode==='lpattern')return logicPatternQuestion(item.level);const q=structuredClone(item.q);q.choices=shuffle(q.choices);return q}

// --- 球場進度：每答對 1 題推進 1 個壘包，4 個壘包回本壘得 1 分 ---
function localDay(d){const x=new Date(d);return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()}
function progressStats(){const today=localDay(Date.now());let todayCorrect=0,total=0;for(const s of data.sessions){total+=s.correct;if(localDay(s.date)===today)todayCorrect+=s.correct}
 return {todayCorrect,todayRuns:Math.floor(todayCorrect/4),runner:todayCorrect%4,toNext:4-todayCorrect%4,careerRuns:Math.floor(total/4),total}}
function dayStreak(){const days=[...new Set(data.sessions.map(s=>localDay(s.date)))].map(d=>{const [y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).getTime()}).sort((a,b)=>a-b);let best=0,cur=0,prev=null;for(const t of days){cur=prev!==null&&Math.round((t-prev)/86400000)===1?cur+1:1;best=Math.max(best,cur);prev=t}return best}

function pickEnglishVoice(){
  const voices=getEnglishVoices();
  if(voicePrefs.voiceURI){const chosen=voices.find(v=>v.voiceURI===voicePrefs.voiceURI);if(chosen)return chosen}
  // Some iPhones have downloaded premium/enhanced voices. Prefer them automatically;
  // if the device has none, its standard US-English voice remains the fallback.
  const quality=v=>{
    const name=String(v.name||'').toLowerCase();let score=0;
    if(/premium|enhanced/.test(name))score+=60;
    if(/siri|neural|natural/.test(name))score+=38;
    if(/ava|samantha|allison/.test(name))score+=8;
    if(v.localService)score+=5;
    if(v.default)score+=9;
    return score;
  };
  return voices.slice().sort((a,b)=>quality(b)-quality(a))[0]||null;
}

function choicesForAnswer(answer,level,max=Infinity){const set=new Set([answer]);let iter=0;while(set.size<4&&iter++<140){const span=Math.max(4,Math.ceil(Math.max(8,answer)*(.18+(level-1)*.09)));let n=answer+rand(-span,span);if(n===answer||n<0||n>max)continue;set.add(n)}for(let n=answer+1;set.size<4&&n<=max;n++)set.add(n);for(let n=answer-1;set.size<4&&n>=0;n--)set.add(n);return shuffle([...set]).map(String)}

{q.readingOnly?'<div class="tipline">📚 這是自主閱讀關卡：先自己讀、圈出線索；不必搶快，也不用一次全懂。</div>':''}${q.hint&&!feedback?`<div class="hint-box"><button type="button" class="hint-toggle" data-action="hint">💭 不知道怎麼開始？看思路提示</button>${session.usedHint?`<p class="hint-text">${h(q.hint)}</p>`:''}</div>`:''}<button type="button" class="hw-quiz-toggle" data-action="quiz-handwrite" aria-expanded="${handQuizOpen}">✍️ ${session.subject==='math'?'手寫計算草稿':session.subject==='english'?'手寫英文草稿':'手寫思考草稿'}　${handQuizOpen?'▲ 收起':'▼ 展開'}（可用手指／Apple Pencil）</button>${handQuizOpen?`<section class="hw-quiz-box">${handPadMarkup('',false,true)}${session.subject==='math'?handRecognizerControls('math'):session.subject==='english'?handRecognizerControls('english'):''}${session.subject==='math'?`<form class="hw-check" data-hw-form="quiz"><div class="hw-field"><label for="hw-check-input">算好後輸入答案驗算</label><input id="hw-check-input" inputmode="decimal" autocomplete="off" placeholder="例如：24" aria-label="輸入計算答案"></div><button class="btn btn-dark" type="submit">✅ 驗算</button></form><div class="hw-message" id="hw-feedback" role="status" aria-live="polite">${h(handResult)}</div>`:''}<p class="hw-note">試用免費本機筆跡辨識；辨識可能有誤，請確認自動填入的答案後，再按核對或驗算。原本的選擇題分數不受影響。</p></section>`:''}<div class="optiongrid ${q.bigChoices?'big':''}" role="group" aria-label="選擇答案">${q.choices.map((o,i)=>{const correct=feedback&&o===q.answer,wrong=feedback&&o===selected&&o!==q.answer;return `<button class="option ${correct?'correct':''} ${wrong?'incorrect':''}" data-action="answer" data-choice="${i}" ${feedback?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${h(o)}</span></button>`}).join('')}</div>${feedback?`<div class="feedback ${feedback.correct?'':'bad'}" role="status"><strong>${feedback.correct?themeCopy().right:'💡 沒關係，我們一起看看'}</strong><p>正確答案：<b>${h(q.answer)}</b><br>${h(q.explain)}</p>${session.mode==='use'?'<button class="speech-test" type="button" data-action="speak-answer">🔊 聽正確單字</button>':''}${q.zyAnswerSym?`<button class="speech-test" type="button" data-action="zy-play-answer">🔊 聽「${h(q.zyAnswerSym)}」</button>`:''}${q.reviewId?'<p class="auto-next-hint">🔁 複習題：即使答對，也會隔一段時間再複習，確認真的記得。</p>':''}${feedback.correct&&data.settings.autoNext&&!handQuizOpen&&!q.reason&&!q.readingOnly?'<p class="auto-next-hint">⏳ 短暫顯示解析後自動繼續；也可手動按下一題。</p>':(q.reason||q.readingOnly)?'<p class="auto-next-hint">🧠 深度題不自動跳題，請想一想解題思路再繼續。</p>':!feedback.correct?'<p class="auto-next-hint">先看懂解析，再按下一題。</p>':''}</div><button class="btn btn-dark quiz-next" data-action="next">${session.idx===tot-1?'看這回合的練習回顧':'下一題 →'}</button>`:''}</section><p class="mobile-note" style="text-align:center;margin-top:14px">不用搶快。答錯是找出學習方向的重要線索。</p></div>`}
function answer(choiceIndex){clearAdvance();if(!session||feedback)return;const q=session.items[session.idx],sel=q.choices[choiceIndex];if(sel===undefined)return;const ok=sel===q.answer;feedback={selected:sel,correct:ok};chime(ok);if(ok)session.correct++;else session.missed.push({main:q.isListening?q.speech:q.main,answer:q.answer,explain:q.explain});session.attempts.push({skill:q.skill,correct:ok,hintUsed:!!session.usedHint,review:!!q.reviewId,concept:q.concept||'',level:q.reviewLevel||session.level});if(q.reviewId)markReview(q,ok);else if(!ok)newReviewMiss(q,session);save();session.usedHint=false;render();if(ok&&data.settings.autoNext&&!handQuizOpen&&!q.reason&&!q.readingOnly){const currentSession=session,currentFeedback=feedback;advanceTimer=setTimeout(()=>{advanceTimer=null;if(page==='quiz'&&session===currentSession&&feedback===currentFeedback)next()},1600)}}
function next(){clearAdvance();if(!session||!feedback)return;session.idx++;feedback=null;handInk=[];handAnswerInk=[];handOcrResult='';handQuizOpen=false;handResult='';session.usedHint=false;if(session.idx>=session.items.length)finish();else{render();autoReadSoon()}}
function finish(){clearAdvance();const s=session;if(!s)return;const badgesBefore=new Set(earnedBadgeIds());finished={...s};const entry={date:new Date().toISOString(),subject:s.subject,mode:s.mode,level:s.level,total:s.items.length,correct:s.correct,attempts:s.attempts};rememberRound(s);data.sessions.push(entry);data.sessions=data.sessions.slice(-300);save();finished.newBadges=earnedBadgeIds().filter(x=>!badgesBefore.has(x));page='result';session=null;window.scrollTo(0,0);render()}
function result(){if(!finished)return '';const s=finished,tot=s.items.length;const rate=Math.round(100*s.correct/tot),title=rate>=88?'今天完成了一場好練習！':rate>=63?'每一題都在讓你進步！':'錯的題目，就是下一次的起點！';const due=dueReviews(s.subject).length;return `<div class="result"><div class="result-hero"><div class="result-emoji" aria-hidden="true">${rate>=88?'🏆':rate>=63?worldInfo().icon:'🌱'}</div><h1>${title}</h1><p>${subName(s.subject)} · 第 ${s.level} 級 · ${MODES[s.subject].find(m=>m.id===s.mode).name}</p><div class="result-score">${s.correct} <span style="font-size:20px">/ ${tot} 題</span></div><p>理解比速度重要；有錯題就透過下次練習慢慢補強。</p></div>${resultBallpark(s)}${s.missed.length?`<section class="card review"><h3>💡 今天可以再想一想的題目</h3><ul style="padding-left:20px">${s.missed.slice(0,4).map(x=>`<li>${h(x.main)}<br><strong>答案：${h(x.answer)}</strong>　${h(x.explain)}</li>`).join('')}</ul><p class="note">答錯題目會加入本機複習清單；如果已關閉複習功能，則只保留本回合的解析。</p></section>`:''}<section class="card reflection"><label for="reflection">💬 用一句話告訴家人：今天我學到……（可不填）</label><textarea id="reflection" maxlength="160" placeholder="例如：我知道 because 表示原因；我會先算總價再找零。"></textarea><div class="rowactions"><button class="btn btn-outline" data-action="save-reflection">儲存小心得</button></div></section><div class="result-buttons">${due?`<button class="btn btn-primary" data-action="review-sub" data-subject="${s.subject}">🔁 立即複習 ${due} 題</button>`:''}<button class="btn btn-dark" data-action="again">再練一次</button><button class="btn btn-outline" data-action="nav-home">回到首頁</button></div></div>`}

function getSkillStat(skill){const attempts=data.sessions.flatMap(s=>Array.isArray(s.attempts)?s.attempts:[]).filter(a=>a.skill===skill);const n=attempts.length,hit=attempts.filter(a=>a.correct).length;return {n,hit,pct:n?Math.round(hit/n*100):0}}
function subjectReport(sub){const x=getSubStats(sub),s=data.sessions.filter(x=>x.subject===sub),recent=s.slice(-4),rAcc=recent.length?Math.round(recent.reduce((a,x)=>a+x.correct,0)/recent.reduce((a,x)=>a+x.total,0)*100):null;return `<div style="display:flex;justify-content:space-between;gap:10px"><strong style="font-size:18px">${SUBJECT_META[sub].icon+' '+SUBJECT_META[sub].name}</strong><span class="tag">難度 ${data.settings[sub]}</span></div><div class="statrow" style="margin-top:14px"><div class="stat"><strong>${x.num}</strong><small>已完成回合</small></div><div class="stat"><strong>${rAcc===null?'—':rAcc+'%'}</strong><small>近4回合正確率</small></div></div>${recent.length?`<p class="note">${recent.length<2?'目前資料很少，先累積幾次練習。':recent.filter(x=>x.correct>=7).length>=2?'近4回合至少兩回合答對7題以上，可考慮先觀察孩子解題過程，再試進階。':'練習時可優先複習答錯的概念，不必急著升級。'}</p>`:`<p class="note">還沒有練習紀錄。先從基礎級玩一回合吧。</p>`}`}
function parent(){if(!parentUnlocked)return parentGate();const ss=data.sessions.slice(-8).reverse();const w=Object.values(SKILL_GROUPS).flat();const weakest=w.map(k=>({k,...getSkillStat(k)})).filter(x=>x.n>=5).sort((a,b)=>a.pct-b.pct).slice(0,2);return `<div class="pageheading"><div class="eyebrow">PARENT COACH CENTER</div><h1>📋 家長陪練中心</h1><p style="margin:2px 0 8px"><span class="pill">目前查看：${activeProfile().avatar} ${h(activeProfile().name)} · ${GRADES[grade()]}</span></p><p>讓孩子保有棒球熱情，也把英數與生活能力慢慢練起來。</p></div><div class="parent-banner">🔒 <b>隱私說明：</b>這是單機試作版，不需要帳號，不會上傳學習紀錄。家長區設有本機密碼，可阻止孩子誤入，但無法取代正式帳號與伺服器權限管理。</div>${parentTabsNav()}<div class="ptabs" data-active="${parentTab}"><div class="ptab" data-tab="report"><div class="parent-grid">${SUBJECT_KEYS.map(sb=>`<section class="card"><h3>${subName(sb)}進度</h3>${subjectReport(sb)}</section>`).join('')}</div>
<div class="section-title"><div><h2>各項練習能力</h2><p>以練習題答對比例估算，不能當作正式能力鑑定。</p></div></div><div class="parent-grid">${SUBJECT_KEYS.map(sb=>`<section class="card"><h3>${SUBJECT_META[sb].icon} ${subName(sb)}能力</h3>${SKILL_GROUPS[sb].map(skillMeter).join('')}</section>`).join('')}</div>
<div class="section-title"><div><h2>個人化複習排程</h2><p>答錯先加入清單；答對後於1、3、7天再複習，逐步鞏固理解。這是設計規則，不是教育成效保證。</p></div></div><section class="card"><div class="statrow"><div class="stat"><strong>${data.reviewQueue.length}</strong><small>待鞏固概念</small></div><div class="stat"><strong>${dueReviews().length}</strong><small>目前可複習</small></div></div><div class="rowactions" style="margin-top:13px">${SUBJECT_KEYS.map(sb=>dueReviews(sb).length?`<button class="btn btn-outline" data-action="review-sub" data-subject="${sb}">${subName(sb)}複習 ${dueReviews(sb).length} 題</button>`:'').join('')}</div><p class="note">複習清單存在本機；答錯後可以當天再挑戰，接著按間隔安排下一次。大人應一起確認解題過程，不只看正確率。</p></section><div class="section-title"><div><h2>每週陪伴建議</h2><p>把練習學到的東西用回生活，比多刷幾題更重要。</p></div></div><div class="two-col"><section class="card"><h3>🏡 本週家中任務</h3><div class="mini-plan"><b>英文：</b>先認 3 個大小寫字母並聽發音，再找家裡 1 個物品學英文名稱。<br><b>數學：</b>去超市時請孩子估算 2～3 件商品的總價，再核對結果。<br><b>表達：</b>請孩子解釋一題他算對或算錯的題目，重點是「怎麼想」。<br><b>自主管理：</b>自己檢查球具與隔天上學用品。</div><p class="note">上面的生活任務是家長可自行調整的建議，不是標準化教育測驗。</p></section><section class="card"><h3>🧭 需要多一點陪練的地方</h3>${weakest.length?weakest.map(x=>`<p class="note">• <strong>${SKILLS[x.k]}</strong>：目前 ${x.hit}/${x.n} 題正確，適合一起回顧錯題與概念。</p>`).join(''):'<div class="empty">各項能力至少練過 5 題後，這裡才會提示值得複習的領域。</div>'}<div class="wellbeing" style="margin-top:16px">🌿 孩子疲倦、挫折或不想練時，可以直接結束，不用補做或追進度。</div></section></div>
</div><div class="ptab" data-tab="players">${playerManager()}</div><div class="ptab" data-tab="practice"><div class="section-title"><div><h2>練習難度設定</h2><p>請依孩子實際理解調整，不以年齡直接決定。</p></div></div><section class="card"><div class="settings-row"><label for="set-en">英文難度<small>字母 A～Z 不分難度。第1級生活與棒球單字；第2級句子較長；第3級抽象字詞與長篇推理；第4級菁英：段落閱讀與進階單字（約國小高年級）</small></label><select id="set-en" data-action="level" data-subject="english"><option value="1" ${data.settings.english===1?'selected':''}>1 基礎</option><option value="2" ${data.settings.english===2?'selected':''}>2 進階</option><option value="3" ${data.settings.english===3?'selected':''}>3 挑戰</option><option value="4" ${data.settings.english===4?'selected':''}>4 菁英</option></select></div><div class="settings-row"><label for="set-ma">數學難度<small>第1級：以20以內加減為主，含簡單乘法、時間與錢；第2級：100以內加減與九九乘法；第3級：三位數、除法與多步驟；第4級菁英：四位數、兩位數乘法、餘數、分數</small></label><select id="set-ma" data-action="level" data-subject="math"><option value="1" ${data.settings.math===1?'selected':''}>1 基礎</option><option value="2" ${data.settings.math===2?'selected':''}>2 進階</option><option value="3" ${data.settings.math===3?'selected':''}>3 挑戰</option><option value="4" ${data.settings.math===4?'selected':''}>4 菁英</option></select></div>${levelRow('zhuyin','set-zy','第1級符號辨認；第2級加入聲調與拼音、選項更相近；第3級容易混淆的符號一起出現')}${levelRow('logic','set-lo','第1級 3 人打序、簡單規律；第2級 4 人打序與棒球規則；第3級「如果……就……」推論')}${levelRow('science','set-sc','題目依級別累加；第1級生活觀察，第2～3級加入原理與科學方法')}<div class="settings-row"><label for="round-size">每回合題數<small>大班建議 5 題；覺得太少可以調到 8 或 10 題。</small></label><select id="round-size" data-action="round-size">${[5,8,10].map(v=>`<option value="${v}" ${(data.settings.roundSize||8)===v?'selected':''}>${v} 題</option>`).join('')}</select></div><p class="note">覺得太簡單：把難度調高一級，並試試數學「思考挑戰」、邏輯「數獨」「誰說謊」、英文「拼字」「句子重組」、注音「語詞注音」。第3級會增加閱讀難度、三位數與除法。若孩子不理解題目，建議先降級並補充口頭示範。</p></section>

 if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(hh*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(hh*dpr)}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,hh);

}

 const noScroll=e=>{if(e.cancelable)e.preventDefault()};

 c.addEventListener('pointerdown',e=>{if(drawingPointer!==null||e.isPrimary===false||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();drawingPointer=e.pointerId;const ink=inkNow();ink.push([loc(e)]);handInkRevision++;handScoreHtml='';if(ink.length>240)ink.shift();try{c.setPointerCapture(e.pointerId)}catch(_){}paintHandCanvas(c)});
 c.addEventListener('pointermove',e=>{const ink=inkNow();if(e.pointerId!==drawingPointer||!ink.length)return;e.preventDefault();const stroke=ink[ink.length-1];if(stroke.length<5000)stroke.push(loc(e));queueHandPaint(c)});
 const end=e=>{if(e.pointerId!==drawingPointer)return;e.preventDefault();drawingPointer=null;try{if(c.hasPointerCapture(e.pointerId))c.releasePointerCapture(e.pointerId)}catch(_){}paintHandCanvas(c)};

 }

function handStrokeGroups(ink){
 const strokes=ink.filter(s=>s&&s.length).map(points=>({points,x1:Math.min(...points.map(p=>p[0])),x2:Math.max(...points.map(p=>p[0])),y1:Math.min(...points.map(p=>p[1])),y2:Math.max(...points.map(p=>p[1]))}));
 if(!strokes.length)return [];
 // Horizontal overlap combines multi-stroke glyphs (A, H, t and dotted i).
 let groups=strokes.map(s=>({strokes:[s],x1:s.x1,x2:s.x2,y1:s.y1,y2:s.y2}));
 let changed=true,rounds=0;
 while(changed&&rounds++<100){changed=false;outer:for(let i=0;i<groups.length;i++)for(let j=i+1;j<groups.length;j++){
 const a=groups[i],b=groups[j];const overlap=Math.min(a.x2,b.x2)-Math.max(a.x1,b.x1);
 const eps=.007;
 const gap=Math.max(0,Math.max(a.x1,b.x1)-Math.min(a.x2,b.x2));
 const centerClose=Math.abs((a.x1+a.x2)-(b.x1+b.x2))<Math.max(.027,Math.min(a.x2-a.x1,b.x2-b.x1)*.8);
 const nearby=overlap>=-.002||(gap<eps&&centerClose);
 if(nearby){groups[i]={strokes:a.strokes.concat(b.strokes),x1:Math.min(a.x1,b.x1),x2:Math.max(a.x2,b.x2),y1:Math.min(a.y1,b.y1),y2:Math.max(a.y2,b.y2)};groups.splice(j,1);changed=true;break outer}
 }}
 return groups.sort((a,b)=>a.x1-b.x1);
}
function handMaskFromStrokes(strokes){
 const useAnswer=handTab==='math'||page==='quiz'&&session?.subject==='math';
 const el=document.getElementById(useAnswer?'hw-answer-canvas':'hw-canvas');
 const ratio=el?Math.max(.9,Math.min(useAnswer?2.4:1.65,el.clientWidth/Math.max(1,el.clientHeight))):1.4;
 const points=strokes.flatMap(s=>(s.points||s).map(p=>[p[0]*ratio,p[1]]));if(!points.length)return null;
 let xmin=1,xmax=0,ymin=1,ymax=0;
 for(const [x,y]of points){xmin=Math.min(xmin,x);xmax=Math.max(xmax,x);ymin=Math.min(ymin,y);ymax=Math.max(ymax,y)}
 const ww=Math.max(.004,xmax-xmin),hh=Math.max(.004,ymax-ymin),size=52,pad=5;
 const canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d',{willReadFrequently:true});
 ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);ctx.strokeStyle='#000';ctx.lineWidth=3.2;ctx.lineCap='round';ctx.lineJoin='round';
 const scale=Math.min((size-2*pad)/ww,(size-2*pad)/hh);const px=(size-ww*scale)/2,py=(size-hh*scale)/2;
 for(const st of strokes){const ps=(st.points||st).map(p=>[p[0]*ratio,p[1]]);if(ps.length<1)continue;ctx.beginPath();ctx.moveTo(px+(ps[0][0]-xmin)*scale,py+(ps[0][1]-ymin)*scale);for(const pt of ps.slice(1))ctx.lineTo(px+(pt[0]-xmin)*scale,py+(pt[1]-ymin)*scale);if(ps.length===1){ctx.lineTo(px+(ps[0][0]-xmin)*scale+.1,py+(ps[0][1]-ymin)*scale)}ctx.stroke()}
 return handImageFeatures(ctx.getImageData(0,0,size,size).data,size);
}

 for(let y=0;y<80;y++)for(let x=0;x<80;x++){const i=(y*80+x)*4;if(d[i]<160){x1=Math.min(x1,x);x2=Math.max(x2,x);y1=Math.min(y1,y);y2=Math.max(y2,y)}}
 if(x1>x2)continue;const pad=5,srcw=x2-x1+1,srch=y2-y1+1,scale=Math.min(42/srcw,42/srch);

function handMaskDistance(a,b){
 // Symmetric nearest-neighbor strokes (chamfer-like) tolerates moderate stroke width differences.
 const n=52,ar=[],br=[];for(let i=0;i<n*n;i++){if(a[i])ar.push(i);if(b[i])br.push(i)}if(!ar.length||!br.length)return Infinity;
 // 5x5 soft overlap. Fast approximation to distance transform.
 const neigh=(src,dst)=>{let sum=0;for(const i of src){const x=i%n,y=(i/n)|0;let best=12;
 for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){
 const xx=x+dx,yy=y+dy;if(xx<0||xx>=n||yy<0||yy>=n)continue;
 if(dst[yy*n+xx])best=Math.min(best,dx*dx+dy*dy);
 }sum+=Math.min(12,best)}return sum/src.length};
 return neigh(ar,b)*.55+neigh(br,a)*.45;
}
function handGuessCharacter(strokes,kind){

 case'hand-mode-letter':handMode='letter';handReset();render();break;
 case'hand-mode-word':handMode='word';handReset();render();break;
 case'hand-prev':if(handMode==='letter')handLetter=(handLetter+25)%26;else handWord=(handWord+handWordPool().length-1)%handWordPool().length;handReset();render();break;
 case'hand-next':if(handMode==='letter')handLetter=(handLetter+1)%26;else handWord=(handWord+1)%handWordPool().length;handReset();render();break;
 case'hand-ocr-select':{const w=b.dataset.word;if(!w||!handOcrCandidates.includes(w))break;const input=document.getElementById('hw-check-input');if(input)input.value=w;handOcrResult='✍️ 已選擇字庫候選：'+w+'。請核對你的筆跡後，再按下方核對。';const status=document.getElementById('hw-ocr-result');if(status)status.textContent=handOcrResult;break;}case'hand-math-next':handMath=calcQuestion(data.settings.math);handReset();render();break;case'hand-recognize':handRecognize();break;case'hand-answer-undo':if(handAnswerInk.length)handAnswerInk.pop();clearHandRecognition();{const c=document.getElementById('hw-answer-canvas');if(c)paintHandCanvas(c)}break;case'hand-answer-clear':handAnswerInk.length=0;clearHandRecognition();{const c=document.getElementById('hw-answer-canvas');if(c)paintHandCanvas(c)}returnToWritingPad('hw-answer-canvas');break;
 case'hand-math-explain':handSolution=!handSolution;render();break;case'hand-zoom':resizeHandPad(false);break;case'hand-answer-zoom':resizeHandPad(true);break;
 case'hand-listen':playEnglish(currentHandTarget());break;
 case'hand-clear':handInk.length=0;clearHandRecognition();handActivePointer=null;{const c=document.getElementById('hw-canvas');if(c)paintHandCanvas(c)}returnToWritingPad('hw-canvas');break;
 case'hand-undo':if(handInk.length)handInk.pop();clearHandRecognition();handActivePointer=null;{const c=document.getElementById('hw-canvas');if(c)paintHandCanvas(c)}break;
 case'answer':stopEnglish();answer(Number(b.dataset.choice));break;case'next':stopEnglish();next();break;case'speak':speak();break;case'speak-slower':speakSlower();break;case'speak-answer':if(session&&feedback&&session.mode==='use')playEnglish(session.items[session.idx].answer);break;case'transcript':document.getElementById('transcript')?.classList.toggle('hidden');break;case'quit':if(confirm('這回合還沒完成，確定要離開嗎？未完成的題目不會計入紀錄。'))navigate('select');break;case'again':if(finished){const s=finished;subject=s.subject;start(s.mode)}break;case'save-reflection':{const val=document.getElementById('reflection')?.value.trim();if(!val){toast('還沒寫心得，也可以跳過喔。');break}data.reflections.push({date:new Date().toISOString(),text:val.slice(0,160)});data.reflections=data.reflections.slice(-100);save();document.getElementById('reflection').value='';toast('已在這台裝置儲存小心得！');break}case'export':if(parentUnlocked)exportJson();break;case'import':if(parentUnlocked)document.getElementById('import-file')?.click();break;case'print':if(parentUnlocked)window.print();break;case'reset':if(parentUnlocked&&confirm('確定清除這台裝置的所有練習紀錄與心得嗎？此操作無法還原。')){data=structuredClone(DEFAULT);save();render();toast('已清除本機練習紀錄。')}break;default:break}});
app.addEventListener('change',async e=>{const el=e.target;if(el.id!=='import-file'||!parentUnlocked)return;const file=el.files?.[0];if(!file)return;try{if(file.size>2_000_000)throw new Error('檔案超過2MB');const obj=JSON.parse(await file.text());if(obj.app!=='全壘打雙軌學院'||!Array.isArray(obj.sessions)||!Array.isArray(obj.reflections)||!obj.settings)throw new Error('格式不符');if(!confirm('匯入會取代這台裝置目前的紀錄。確定要繼續嗎？'))return;const sessions=obj.sessions.slice(-300).map(cleanHistorySession).filter(Boolean);const reflections=obj.reflections.slice(-100).map(cleanHistoryReflection).filter(Boolean);data={settings:normalizeSettings(obj.settings),sessions,reflections,reviewQueue:sanitizeReviewQueue(obj.reviewQueue),recent:cleanRecent(obj.recent)};save();render();toast('練習紀錄已匯入。')}catch(err){toast('無法匯入：'+err.message)}finally{el.value=''}});
// No voice/engine selector: device speech is always used; fallback MP3 only for unavailable devices.
app.addEventListener('change',e=>{const x=e.target;if(x.dataset.action==='review-enabled'){if(!parentUnlocked)return;data.settings.reviewEnabled=x.checked;save();render();toast(x.checked?'已開啟複習排程':'已暫停複習排程（原紀錄仍保存）');return}if(x.dataset.action==='auto-next'){if(!parentUnlocked){toast('請先解鎖家長區。');return}data.settings.autoNext=x.checked;save();toast(x.checked?'已開啟：答對自動下一題':'已關閉：每題都手動按下一題');return}if(x.dataset.action==='prefer-parent'){if(!parentUnlocked)return;try{localStorage.setItem(PREFER_PARENT_KEY,x.checked?'1':'0')}catch(_){}toast(x.checked?'有錄音的符號會播放家長錄音':'一律播放內建音檔');return}if(x.dataset.action==='zh-voice'){try{localStorage.setItem(VOICE_PREF_KEY,x.value)}catch(_){}speakChinese('這是新的朗讀聲音');return}if(x.dataset.action==='round-size'){if(!parentUnlocked)return;data.settings.roundSize=Number(x.value)||8;save();toast('每回合 '+data.settings.roundSize+' 題');return}if(x.dataset.action==='auto-read'||x.dataset.action==='sound'){if(!parentUnlocked)return;data.settings[x.dataset.action==='auto-read'?'autoRead':'sound']=x.checked;save();toast(x.checked?'已開啟':'已關閉');return}if(x.dataset.action!=='level')return;const sub=x.dataset.subject,lv=Number(x.value);if(!parentUnlocked||!SUBJECT_KEYS.includes(sub)||![1,2,3,4].includes(lv))return;data.settings[sub]=lv;save();render();toast('已調整'+subName(sub)+'難度為第 '+lv+' 級。')});
if('speechSynthesis' in window){try{window.speechSynthesis.addEventListener('voiceschanged',populateSpeechVoices);window.speechSynthesis.addEventListener('voiceschanged',()=>{if(page==='parent'&&!document.activeElement?.closest?.('form'))render()},{once:true})}catch(_){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopEnglish();clearAdvance();if(page==='parent'){parentUnlocked=false;render()}}});
window.addEventListener('hashchange',()=>{if(location.hash==='#home')navigate('home')});
try{if(!sessionStorage.getItem(PICKED_KEY))page='login'}catch(_){page='login'}
render();
populateSpeechVoices();
