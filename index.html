/* English alphabet foundation: mobile-friendly and keyboard accessible */
.alpha-intro{background:linear-gradient(125deg,#e7f5ec,#edf5ff);border:1px solid #d3e9dd;border-radius:23px;padding:21px 23px;margin:0 0 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}

function getEnglishVoices(){if(!('speechSynthesis' in window))return [];try{return speechSynthesis.getVoices().filter(v=>/^(en-US|en_US|en)$/i.test(v.lang||''))}catch(_){return []}}
function pickEnglishVoice(){
  const voices=getEnglishVoices();
  if(voicePrefs.voiceURI){const chosen=voices.find(v=>v.voiceURI===voicePrefs.voiceURI);if(chosen)return chosen}
  // Some iPhones have downloaded premium/enhanced voices. Prefer them automatically;
  // if the device has none, its standard US-English voice remains the fallback.
  const quality=v=>{
    const name=String(v.name||'').toLowerCase();let score=0;
    if(/premium|enhanced/.test(name))score+=60;
    if(/siri|neural|natural/.test(name))score+=38;
    if(/ava|samantha|allison/.test(name))score+=8;
    if(v.localService)score+=5;
    if(v.default)score+=9;
    return score;
  };
  return voices.slice().sort((a,b)=>quality(b)-quality(a))[0]||null;
}

 const attempts=Array.isArray(s.attempts)?s.attempts.slice(0,8).filter(a=>a&&typeof a==='object'&&typeof a.skill==='string'&&Object.prototype.hasOwnProperty.call(SKILLS,a.skill)&&typeof a.correct==='boolean').map(a=>({skill:a.skill,correct:a.correct,hintUsed:!!a.hintUsed,review:!!a.review,concept:typeof a.concept==='string'?a.concept.slice(0,80):'',level:[1,2,3].includes(Number(a.level))?Number(a.level):1})):[];
 return {date:when,subject:s.subject,mode:s.mode,level:[1,2,3].includes(Number(s.level))?Number(s.level):1,total,correct,attempts};
}

const hex=b=>Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
function hexBytes(s){return new Uint8Array(s.match(/.{2}/g).map(x=>parseInt(x,16)))}
async function hashPin(pin,salt){
 if(!crypto?.subtle)throw new Error('目前瀏覽器無法安全設定密碼，請使用 Safari 或 Chrome 開啟 HTTPS 網站。');
 const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
 return hex(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:hexBytes(salt),iterations:180000,hash:'SHA-256'},k,256)));
}

async function handleParentForm(e){const form=e.target;if(!(form instanceof HTMLFormElement)||!form.dataset.pinForm)return;
 e.preventDefault();const mode=form.dataset.pinForm,pin=String(form.elements.namedItem('pin')?.value||''),confirmPin=String(form.elements.namedItem('confirm')?.value||'');
 if(!/^[0-9]{6,12}$/.test(pin)){pinMessage('密碼須為 6～12 位數字。');return}
 const submit=form.querySelector('button[type="submit"]');if(submit)submit.disabled=true;
 try{
  if(mode==='create'){
   if(parentPinRecord()){pinMessage('此裝置已有密碼設定，請重新整理後解鎖。');return}
   if(pin!==confirmPin){pinMessage('兩次輸入的密碼不一致。');return}
   const salt=hex(crypto.getRandomValues(new Uint8Array(16)));
   const hash=await hashPin(pin,salt);
   localStorage.setItem(PARENT_KEY,JSON.stringify({v:1,salt,hash}));parentUnlocked=true;parentFailures=0;navigate('parent');toast('家長區密碼設定完成。');
  }else if(mode==='unlock'){
   if(Date.now()<parentCooldownUntil){pinMessage('錯誤次數過多，請稍後再試。');return}
   const auth=parentPinRecord();if(!auth){render();return}
   const hash=await hashPin(pin,auth.salt);
   if(constantMatch(hash,auth.hash)){parentUnlocked=true;parentFailures=0;parentCooldownUntil=0;navigate('parent')}else{
    parentFailures++;if(parentFailures>=5){parentCooldownUntil=Date.now()+30000;parentFailures=0;pinMessage('連續輸入錯誤，暫停 30 秒。')}else pinMessage('密碼不正確，請再試一次。');
    form.elements.namedItem('pin').value='';
   }
  }else if(mode==='change'){
   if(!parentUnlocked||!parentPinRecord()){pinMessage('請先解鎖家長區。');return}
   const current=String(form.elements.namedItem('current')?.value||'');
   const auth=parentPinRecord();const currentHash=await hashPin(current,auth.salt);
   if(!constantMatch(currentHash,auth.hash)){toast('原密碼不正確。');return}
   if(pin!==confirmPin){toast('兩次新密碼不一致。');return}
   const salt=hex(crypto.getRandomValues(new Uint8Array(16)));
   localStorage.setItem(PARENT_KEY,JSON.stringify({v:1,salt,hash:await hashPin(pin,salt)}));form.reset();toast('已更新家長密碼。');
  }
 }catch(err){pinMessage('密碼操作失敗：'+(err?.message||'請確認瀏覽器支援安全儲存。'))}finally{if(submit&&submit.isConnected)submit.disabled=false}
}

function choicesForAnswer(answer,level,max=Infinity){const set=new Set([answer]);let iter=0;while(set.size<4&&iter++<140){const span=Math.max(4,Math.ceil(Math.max(8,answer)*(.18+(level-1)*.09)));let n=answer+rand(-span,span);if(n===answer||n<0||n>max)continue;set.add(n)}for(let n=answer+1;set.size<4&&n<=max;n++)set.add(n);for(let n=answer-1;set.size<4&&n>=0;n--)set.add(n);return shuffle([...set]).map(String)}

function deepQuestion(level,used){const pool=DEEP_READ[level],index=pool.map((x,i)=>({x,i})).filter(v=>!used.has('deep-'+level+'-'+v.i));const {x,i}=one(index.length?index:pool.map((x,i)=>({x,i})));return {skill:x[6],prompt:'📖 先讀完故事，再根據線索回答',main:x[0],second:x[1],answer:x[2],choices:shuffle(x[3]),explain:x[4],hint:x[5],signature:'deep-'+level+'-'+i,concept:'deep-'+x[6],isEnglish:true,readingOnly:true,speech:x[0]};}

function paintHandCanvas(canvas){
 const ctx=canvas.getContext('2d');if(!ctx)return;
 const ink=canvas.id==='hw-answer-canvas'?handAnswerInk:handInk;
 const r=canvas.getBoundingClientRect(),w=Math.max(1,r.width),hh=Math.max(1,r.height),dpr=Math.min(3,window.devicePixelRatio||1);
 if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(hh*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(hh*dpr)}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,hh);
 ctx.strokeStyle='#264eab';ctx.fillStyle='#264eab';ctx.lineWidth=4.2;ctx.lineCap='round';ctx.lineJoin='round';
 for(const stroke of ink){if(!stroke.length)continue;if(stroke.length===1){ctx.beginPath();ctx.arc(stroke[0][0]*w,stroke[0][1]*hh,2.1,0,Math.PI*2);ctx.fill();continue}

}

const handPendingFrames=new WeakMap();

 const noScroll=e=>{if(e.cancelable)e.preventDefault()};
 c.addEventListener('touchstart',noScroll,{passive:false});c.addEventListener('touchmove',noScroll,{passive:false});
 c.addEventListener('gesturestart',noScroll,{passive:false});
 const loc=e=>{const r=c.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-r.left)/Math.max(1,r.width))),Math.min(1,Math.max(0,(e.clientY-r.top)/Math.max(1,r.height)))]};
 c.addEventListener('pointerdown',e=>{if(drawingPointer!==null||e.isPrimary===false||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();drawingPointer=e.pointerId;const ink=inkNow();ink.push([loc(e)]);handInkRevision++;handScoreHtml='';if(ink.length>240)ink.shift();try{c.setPointerCapture(e.pointerId)}catch(_){}paintHandCanvas(c)});

 const end=e=>{if(e.pointerId!==drawingPointer)return;e.preventDefault();drawingPointer=null;try{if(c.hasPointerCapture(e.pointerId))c.releasePointerCapture(e.pointerId)}catch(_){}paintHandCanvas(c)};

// Free device voice is the default. Existing recordings remain a network fallback.
// Keep full sentences intact; only gently slow the speaking rate.
function playSavedAudio(url,label,rate=null,repeat=1){
  stopEnglish();
  const id=speechAttempt;
  const audio=new Audio();activeRecordedAudio=audio;
  audio.preload='auto';audio.src=url;
  audio.playbackRate=rate??SPEEDS[voicePrefs.speed];
  // Keep the same pitch when a child slows the recording down; supported in modern Safari.
  if('preservesPitch' in audio)audio.preservesPitch=true;
  let remaining=repeat;
  audio.onplaying=()=>{if(id===speechAttempt)showSpeechStatus('🔊 播放：'+label)};
  audio.onended=()=>{if(id!==speechAttempt)return;
    if(--remaining>0){
      // Keep a real pause between the two *whole words*. Otherwise iPhone replay sounds glued together.
      showSpeechStatus('👂 停頓一下，再聽第二次；可以跟著念。');
      wordReplayTimer=setTimeout(()=>{
        wordReplayTimer=null;
        if(id!==speechAttempt || activeRecordedAudio!==audio)return;
        try{audio.currentTime=0;const next=audio.play();if(next?.catch)next.catch(fail)}catch(_){fail()}
      },780);
      return;
    }
    activeRecordedAudio=null;showSpeechStatus('✅ 播放完成，可以再按一次重聽。');
  };
  function fail(){if(id!==speechAttempt)return;activeRecordedAudio=null;if(url.includes('/audio/letters/')){showSpeechStatus('⚠️ 字母音檔暫時無法播放，請稍後重新按播放鍵。');return;}showSpeechStatus('⚠️ 音檔無法播放；改用手機的預設語音。');playSyntheticEnglish(label)}
  audio.onerror=fail;
  try{const p=audio.play();if(p?.catch)p.catch(fail)}catch(_){fail()}
  showSpeechStatus('🔊 正在載入發音…');
  return true;
}
function playRecordedLetter(letter){return playSavedAudio(LETTER_RECORDINGS[letter],letter,1)}
function playDeviceEnglish(text,rate=null,repeat=1,fallbackUrl=null){
  const value=String(text||'').trim();
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){
    if(fallbackUrl)return playSavedAudio(fallbackUrl,value,rate,repeat);
    showSpeechStatus('⚠️ 這台裝置沒有可用的英文語音。');return false;
  }
  stopEnglish();
  const id=speechAttempt;
  const synth=window.speechSynthesis;
  const selected=pickEnglishVoice();
  let index=0,started=false,fellBack=false;
  function fail(reason){
    if(id!==speechAttempt||fellBack)return;
    fellBack=true;clearTimeout(voiceHealthTimer);
    if(fallbackUrl){showSpeechStatus('⚠️ 內建英文語音未啟動，改用原本音檔。');playSavedAudio(fallbackUrl,value,rate,repeat)}
    else{speechActive=null;showSpeechStatus('⚠️ 無法播放裝置語音：'+reason+'。請確認裝置有美式英文語音。')}

    if(id!==speechAttempt||fellBack)return;

    try{

      u.pitch=1;u.volume=1;
      speechActive=u;
      u.onstart=()=>{if(id===speechAttempt){started=true;clearTimeout(voiceHealthTimer);showSpeechStatus('🔊 美式英文：'+value+(repeat>1?'（第 '+(index+1)+' 次）':''))}};
      u.onend=()=>{
        if(id!==speechAttempt||fellBack)return;
        clearTimeout(voiceHealthTimer);speechActive=null;
        index++;
        if(index<repeat){
          showSpeechStatus('⏸️ 中間停頓一秒，準備再唸一次。');
          wordReplayTimer=setTimeout(()=>{wordReplayTimer=null;begin()},1100);
        }else showSpeechStatus('✅ 播放完成，可以重聽或挑戰下一題。');
      };
      u.onerror=e=>{if(id!==speechAttempt||fellBack||['canceled','interrupted'].includes(e.error))return;fail(e.error||'裝置語音異常')};

        if(!synth.speaking&&!synth.pending)fail('語音未啟動');
      },3200);
    }catch(err){fail(err.message||'播放失敗')}
  }

function playSyntheticEnglish(text,rate=null){return playDeviceEnglish(text,rate,1,null)}
function playEnglish(text,rate=null){
  const value=String(text||'').trim();
  if(/^[A-Z]$/.test(value))return playRecordedLetter(value);
  const rep=value.match(/^([A-Za-z]+)\.\s+\1\.$/i);
  const word=rep?rep[1]:value;
  const url=WORD_RECORDINGS[word.toLowerCase()]||SENTENCE_RECORDINGS[value]||null;
  const repeat=rep?2:1;
  return playDeviceEnglish(word,rate??(isEnglishSentence(word)?SENTENCE_RATE:null),repeat,url);
}
