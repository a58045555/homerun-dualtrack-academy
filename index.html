const LINEUP_NAMES=['小安','阿哲','小美','阿宏','小婷','阿凱'];
function permutations(arr){if(arr.length<=1)return [arr.slice()];const out=[];arr.forEach((x,i)=>{for(const p of permutations(arr.filter((_,j)=>j!==i)))out.push([x,...p])});return out}
function lineupQuestion(level){
 const n=level===1?3:4,names=shuffle(LINEUP_NAMES).slice(0,n),order=shuffle(names),pos=Object.fromEntries(order.map((x,i)=>[x,i]));
 const all=permutations(names),cn=['一','二','三','四'];
 const makeClue=()=>{const t=rand(0,level===1?3:4);let a=one(names),b=one(names.filter(x=>x!==a));
  if(t===0){const k=rand(0,n-1);return pos[a]===k?null:{text:`${a}不是第${cn[k]}棒。`,ok:p=>p.indexOf(a)!==k,key:'not'+a+k}}
  if(t===1){if(pos[a]>pos[b])[a,b]=[b,a];return {text:`${a}比${b}先上場打擊。`,ok:p=>p.indexOf(a)<p.indexOf(b),key:'bf'+a+b}}
  if(t===2){const x=pos[a]===0?a:pos[a]===n-1?a:null;if(!x)return null;return pos[x]===0?{text:`${x}是第一棒。`,ok:p=>p[0]===x,key:'first'}:{text:`${x}是最後一棒。`,ok:p=>p[n-1]===x,key:'last'}}
  if(t===3){const k=pos[a];return k===0||k===n-1?null:{text:`${a}不是第一棒，也不是最後一棒。`,ok:p=>{const i=p.indexOf(a);return i!==0&&i!==n-1},key:'mid'+a}}
  const i=pos[a];if(i===n-1)return null;const nx=order[i+1];return {text:`${nx}緊接在${a}後面打擊。`,ok:p=>p.indexOf(nx)===p.indexOf(a)+1,key:'nx'+a}};
 let clues=[],guard=0;const fits=c=>all.filter(p=>c.every(x=>x.ok(p)));
 while(fits(clues).length>1&&guard++<200){const c=makeClue();if(!c||clues.some(x=>x.key===c.key))continue;const before=fits(clues).length;if(fits([...clues,c]).length<before)clues.push(c)}
 if(fits(clues).length!==1)return lineupQuestion(level);
 for(let i=clues.length-1;i>=0;i--){const t=clues.filter((_,j)=>j!==i);if(fits(t).length===1)clues=t}
 // 問一個沒有被線索直接說出的棒次
 const stated=new Set();for(const c of clues){if(c.key==='first')stated.add(0);if(c.key==='last')stated.add(n-1)}
 const ks=[...Array(n).keys()].filter(k=>!stated.has(k));const k=ks.length?one(ks):rand(0,n-1),ans=order[k];
 const choices=n===3?shuffle([...names,'線索不夠，無法確定']):shuffle(names);
 return {skill:'logic-order',prompt:'📋 教練的打序線索：排一排，再回答',main:clues.map((c,i)=>`${i+1}. ${c.text}`).join('\n'),second:`${names.join('、')} ${n} 人輪流打擊。誰是第${cn[k]}棒？`,answer:ans,choices,explain:`把線索一條條放進去，正確打序是：${order.map((x,i)=>`第${cn[i]}棒 ${x}`).join(' → ')}。`,hint:'先用最確定的線索固定一個人，再用「不是……」排除其他可能。可以在手寫草稿畫出 1、2、3 格子。',signature:'lineup-'+order.join('')+clues.map(c=>c.key).join(''),concept:'lineup-'+level,reason:true};
}

const PATTERN_SYMBOLS=['⚾','🧤','🧢','⭐','🏆','👟'];
function logicPatternQuestion(level){
 const units=level===1?['AB','ABC','AAB']:level===2?['ABB','AABB','ABCD','ABAC']:['ABC','AABB','ABCD','ABBC'];
 const u=one(units),letters=[...new Set(u)],syms=shuffle(PATTERN_SYMBOLS).slice(0,letters.length),map=Object.fromEntries(letters.map((l,i)=>[l,syms[i]]));
 const at=i=>map[u[i%u.length]];let main,ans,explain,hint,second;
 if(level===1){const len=u.length*2+rand(0,u.length-1);main=[...Array(len)].map((_,i)=>at(i)).join(' ')+' ❓';ans=at(len);second='❓ 應該是哪一個？';explain=`每 ${u.length} 個一組重複：${[...u].map((_,i)=>at(i)).join(' ')}，所以下一個是 ${ans}。`;hint='先找出「一組」有幾個圖案，再接著往下排。'}
 else if(level===2){const len=u.length*3,blank=rand(u.length,len-2);main=[...Array(len)].map((_,i)=>i===blank?'❓':at(i)).join(' ');ans=at(blank);second='中間的 ❓ 應該是哪一個？';explain=`重複的一組是：${[...u].map((_,i)=>at(i)).join(' ')}。第 ${blank+1} 個位置是 ${ans}。`;hint='從頭開始一組一組圈起來，看 ❓ 落在一組裡的第幾個。'}
 else{const show=u.length*2,N=rand(12,24);main=[...Array(show)].map((_,i)=>at(i)).join(' ')+' …';ans=at(N-1);second=`照這個規律一直排下去，第 ${N} 個是哪一個？`;const r=N%u.length||u.length;explain=`每 ${u.length} 個一組。${N}÷${u.length}＝${Math.floor(N/u.length)} 餘 ${N%u.length}${N%u.length===0?'（剛好排完一組，是一組的最後一個）':''}，所以第 ${N} 個和每組第 ${r} 個一樣，是 ${ans}。`;hint='不用全部畫出來：用除法算出排了幾組，看餘數。'}
 const others=shuffle(PATTERN_SYMBOLS.filter(s=>s!==ans));const choices=shuffle([ans,...others.slice(0,3)]);
 return {skill:'logic-pattern',prompt:'🔁 找出圖案重複的規律',main,second,answer:ans,choices,explain,hint,signature:'lp-'+main+second,concept:'lpattern-'+u,reason:level===3};
}

function bankQuestionFrom(item,skill,prompt,sig,reason=true){return {skill,prompt,main:item.q,answer:item.a,choices:shuffle(item.o),explain:item.e,hint:item.h||'先把每個選項想一遍，刪掉一定不對的，再從剩下的選。',signature:sig,concept:sig,reason}}
function pickBank(bank,lv,used,prefix){const tagged=bank.map((x,i)=>({x,i,sig:prefix+'-'+i}));const fresh=tagged.filter(t=>!used.has(t.sig)&&t.x.l<=lv);const same=fresh.filter(t=>t.x.l===lv);return one(same.length?same:fresh.length?fresh:tagged.filter(t=>t.x.l<=lv))}
function bankPoolSize(sub,m,lv){if(sub==='logic'){if(m==='odd')return ODD_BANK.filter(x=>x.l<=lv).length;if(m==='rules')return RULES_BANK.filter(x=>x.l<=lv).length;return 8}if(m==='mix')return 8;return (SCIENCE_BANK[m]||[]).filter(x=>x.l<=lv).length}
function logicQuestion(lv,m,used){
 if(m==='lineup')return lineupQuestion(lv);
 if(m==='lpattern')return logicPatternQuestion(lv);
 if(m==='odd'){const t=pickBank(ODD_BANK,lv,used,'odd');return bankQuestionFrom(t.x,'logic-classify','🔍 找出不同類的一個，想想分類的理由',t.sig,false)}
 const t=pickBank(RULES_BANK,lv,used,'rules');return bankQuestionFrom(t.x,'logic-rule','⚖️ 讀懂規則，再判斷結果',t.sig,true);
}
const SCI_PROMPT={body:'💪 運動與身體的科學',force:'🚀 球場上的力與運動',nature:'⛅ 天氣與自然觀察',lab:'🧪 像科學家一樣思考'};
function scienceQuestion(lv,m,used){const area=m==='mix'?one(['body','force','nature','lab']):m;const t=pickBank(SCIENCE_BANK[area],lv,used,'sci-'+area);return bankQuestionFrom(t.x,'sci-'+area,SCI_PROMPT[area],t.sig,true)}
function generateNewSubjectRound(sub,m,lv){const size=Math.min(8,bankPoolSize(sub,m,lv)),list=[],used=new Set();
 for(let i=0;i<size;i++){let q,k=0;do{q=sub==='logic'?logicQuestion(lv,m,used):scienceQuestion(lv,m,used);k++}while(used.has(q.signature)&&k<60);used.add(q.signature);list.push(q)}return list}
function freshNewSubjectReview(item){if(item.subject==='logic'&&item.mode==='lineup')return lineupQuestion(item.level);if(item.subject==='logic'&&item.mode==='lpattern')return logicPatternQuestion(item.level);const q=structuredClone(item.q);q.choices=shuffle(q.choices);return q}

// --- 球場進度：每答對 1 題推進 1 個壘包，4 個壘包回本壘得 1 分 ---
function localDay(d){const x=new Date(d);return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()}
function progressStats(){const today=localDay(Date.now());let todayCorrect=0,total=0;for(const s of data.sessions){total+=s.correct;if(localDay(s.date)===today)todayCorrect+=s.correct}
 return {todayCorrect,todayRuns:Math.floor(todayCorrect/4),runner:todayCorrect%4,toNext:4-todayCorrect%4,careerRuns:Math.floor(total/4),total}}
function dayStreak(){const days=[...new Set(data.sessions.map(s=>localDay(s.date)))].map(d=>{const [y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).getTime()}).sort((a,b)=>a-b);let best=0,cur=0,prev=null;for(const t of days){cur=prev!==null&&Math.round((t-prev)/86400000)===1?cur+1:1;best=Math.max(best,cur);prev=t}return best}

 {id:'debut',icon:'🎉',name:'開幕戰',desc:'完成第一回合練習',test:x=>x.sessions>=1},

function badgeFacts(){const bySub={english:0,math:0,logic:0,science:0},perDay={};let perfect=false,reviewHits=0;
 for(const s of data.sessions){bySub[s.subject]=(bySub[s.subject]||0)+1;const d=localDay(s.date);(perDay[d]=perDay[d]||new Set()).add(s.subject);if(s.total>=5&&s.correct===s.total)perfect=true;for(const a of s.attempts||[])if(a.review&&a.correct)reviewHits++}
 return {sessions:data.sessions.length,bySub,subjects:Object.values(bySub).filter(Boolean).length,multiDay:Object.values(perDay).some(x=>x.size>=2),perfect,reviewHits,runs:progressStats().careerRuns,streak:dayStreak()}}
function earnedBadgeIds(){const f=badgeFacts();return BADGES.filter(b=>b.test(f)).map(b=>b.id)}
function diamondSvg(runner){const pts={0:[60,104],1:[104,60],2:[60,16],3:[16,60]};const base=(k)=>{const [x,y]=pts[k],on=runner===k&&k>0;return k===0?`<polygon points="${x-7},${y-6} ${x+7},${y-6} ${x+7},${y+1} ${x},${y+7} ${x-7},${y+1}" fill="#fff" stroke="var(--navy)" stroke-width="2"/>`:`<rect x="${x-8}" y="${y-8}" width="16" height="16" transform="rotate(45 ${x} ${y})" fill="${on?'var(--lime)':'#fff'}" stroke="var(--navy)" stroke-width="2"/>`};
 const r=runner>0?`<g transform="translate(${pts[runner][0]},${pts[runner][1]-20})"><circle r="9" fill="var(--yellow)" stroke="var(--navy)" stroke-width="2"/><text y="4" text-anchor="middle" font-size="11">🏃</text></g>`:'';
 return `<svg class="diamond" viewBox="0 0 120 120" role="img" aria-label="${runner?`跑者在${['','一','二','三'][runner]}壘`:'壘上沒有跑者'}"><polygon points="60,104 104,60 60,16 16,60" fill="#bfe3a9" stroke="#8fc078" stroke-width="2"/><circle cx="60" cy="62" r="6" fill="#e9c79b"/>${[1,2,3,0].map(base).join('')}${r}</svg>`}

// --- 數學思考挑戰（每題都由程式計算答案） ---
const WEEK=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function guessNumberPuzzle(){
 for(let tries=0;tries<400;tries++){const n=rand(11,98),a=Math.floor(n/10),b=n%10;
  const gens=shuffle([
   ()=>{const lo=a*10;return {t:`比 ${lo} 大、比 ${lo+10} 小`,f:x=>x>lo&&x<lo+10,ok:n>lo}},
   ()=>({t:n%2?'是單數（奇數）':'是雙數（偶數）',f:x=>x%2===n%2,ok:true}),
   ()=>({t:`十位和個位加起來是 ${a+b}`,f:x=>Math.floor(x/10)+x%10===a+b,ok:true}),
   ()=>a===b?{ok:false}:{t:a>b?'十位數字比個位數字大':'個位數字比十位數字大',f:x=>a>b?Math.floor(x/10)>x%10:x%10>Math.floor(x/10),ok:true},
   ()=>{const k=one([3,4,5].filter(k=>n%k===0));return k?{t:`是 ${k} 的倍數`,f:x=>x%k===0,ok:true}:{ok:false}},
   ()=>{const d=b-a;return d>=1&&d<=4?{t:`個位數字比十位數字多 ${d}`,f:x=>x%10-Math.floor(x/10)===d,ok:true}:{ok:false}}
  ]);
  const props=[];for(const g of gens){const p=g();if(!p.ok||!p.t)continue;props.push(p);const c=[...Array(89)].map((_,i)=>i+10).filter(x=>props.every(q=>q.f(x)));if(c.length===1)break}
  const cand=[...Array(89)].map((_,i)=>i+10).filter(x=>props.every(q=>q.f(x)));
  if(cand.length===1&&cand[0]===n&&props.length>=2&&props.length<=4){const marks='①②③④';const first=[...Array(89)].map((_,i)=>i+10).filter(x=>props[0].f(x)&&props[1].f(x));
   return {main:'我是一個兩位數：\n'+props.map((p,i)=>marks[i]+' '+p.t).join('\n')+'\n我是多少？',ans:n,exp:`同時符合①②的數：${first.slice(0,12).join('、')}${first.length>12?'……':''}${props.length>2?'；再用後面的線索一個一個刪掉':''}，最後只剩 ${n}。`,hint:'先用一條線索列出可能的數，再用其他線索一個一個刪掉。',sig:'guess-'+n+props.map(p=>p.t).join()}}}
 return {main:'我是一個兩位數：\n① 十位和個位加起來是 9\n② 十位數字比個位數字多 5\n我是多少？',ans:72,exp:'和是 9、差是 5：十位 7、個位 2，所以是 72。',hint:'和與差都知道，可以先試試看。',sig:'guess-72'};
}
function challengeQuestion(lv,used){
 const kinds=lv===1?['queue','saw','stairs','weekday','flags','coins']:lv===2?['queue','saw','stairs','weekday','flags','flags0','age','sumdiff','handshake','guess','coins']:['flags0','circle','age2','sumdiff','handshake','guess','chicken','times','balance','weekday','stairs'];
 let kind=one(kinds),g=0;while(used.has('chk-'+kind)&&g++<20)kind=one(kinds);
 let main,ans,exp,hint,sig,choices=null;
 if(kind==='queue'){if(rand(0,1)){const a=rand(3,12),b=rand(2,12);ans=a+b-1;main=`小明排隊，從前面數是第 ${a} 個，從後面數是第 ${b} 個。這一排共有幾個人？`;exp=`${a}＋${b}＝${a+b}，但小明被數了兩次，要減 1：${ans} 人。`;hint='畫圈圈試試看，小明被算了幾次？'}else{const a=rand(2,12),b=rand(2,12);ans=a+b+1;main=`小明排隊，他前面有 ${a} 個人，後面有 ${b} 個人。這一排共有幾個人？`;exp=`前面 ${a} 人＋後面 ${b} 人＋小明自己 1 人＝${ans} 人。`;hint='別忘了算小明自己。'}sig='queue'+main}
 else if(kind==='saw'){const n=rand(3,8),t=rand(2,6);ans=(n-1)*t;main=`把一根木頭鋸成 ${n} 段，每鋸一次要 ${t} 分鐘。一共要鋸幾分鐘？`;exp=`鋸成 ${n} 段只要鋸 ${n-1} 次（鋸 1 次變 2 段）。${n-1}×${t}＝${ans} 分鐘。`;hint='鋸 1 次會變成幾段？鋸 2 次呢？';sig='saw'+n+t}
 else if(kind==='stairs'){const n=rand(3,lv===1?5:8),s=lv===1?rand(5,12):rand(12,22);ans=(n-1)*s;main=`從 1 樓走到 ${n} 樓，每一層樓梯有 ${s} 階。一共要爬幾階？`;exp=`1 樓到 ${n} 樓只要爬 ${n-1} 層。${n-1}×${s}＝${ans} 階。`;hint='1 樓到 2 樓爬幾層？1 樓到 3 樓呢？';sig='stairs'+n+s}
 else if(kind==='weekday'){const w=rand(0,6),n=lv===1?rand(2,9):lv===2?rand(10,30):rand(30,100),r=n%7;ans=WEEK[(w+r)%7];main=`今天是${WEEK[w]}，再過 ${n} 天是星期幾？`;exp=`一個星期 7 天。${n}÷7＝${Math.floor(n/7)} 餘 ${r}，所以從${WEEK[w]}往後數 ${r} 天，是${ans}。`;hint='每過 7 天又回到同一個星期幾。';choices=shuffle([ans,...shuffle(WEEK.filter(x=>x!==ans)).slice(0,3)]);sig='wd'+w+'-'+n}
 else if(kind==='flags'){const d=one([2,3,5,10]),k=rand(3,10),L=d*k;ans=k+1;main=`一條長 ${L} 公尺的步道，每隔 ${d} 公尺插一面旗子，頭和尾都要插。一共要插幾面旗子？`;exp=`${L}÷${d}＝${k} 個間隔；頭尾都插，旗子比間隔多 1：${ans} 面。`;hint='先畫一段短的試試：3 個間隔要插幾面？';sig='fl'+L+d}
 else if(kind==='flags0'){const d=one([2,3,5,10]),k=rand(4,10),L=d*k;ans=k-1;main=`兩棵大樹之間相距 ${L} 公尺，中間每隔 ${d} 公尺種一棵小樹（大樹旁邊不種）。中間要種幾棵小樹？`;exp=`${L}÷${d}＝${k} 個間隔；兩端已經是大樹，小樹比間隔少 1：${ans} 棵。`;hint='兩端都不種的時候，樹比間隔多還是少？';sig='f0'+L+d}
 else if(kind==='circle'){const d=one([2,5,10]),k=rand(5,15),L=d*k;ans=k;main=`一個圓形跑道一圈是 ${L} 公尺，每隔 ${d} 公尺站一位小朋友。一共站了幾位？`;exp=`繞一圈頭尾接在一起，人數等於間隔數：${L}÷${d}＝${ans} 位。`;hint='圓形的頭和尾是同一個點。';sig='ci'+L+d}
 else if(kind==='coins'){const X=rand(3,19)*5;ans=Math.floor(X/10)+(X%10?1:0);main=`只用 10 元和 5 元硬幣，要湊出 ${X} 元，最少要幾枚硬幣？`;exp=`盡量用 10 元：${Math.floor(X/10)} 枚 10 元${X%10?'，再加 1 枚 5 元':''}，共 ${ans} 枚。`;hint='想要硬幣少，就先用大的。';sig='co'+X}
 else if(kind==='age'){const a=rand(8,12),b=rand(3,7),y=rand(2,7),S=a+b+2*y;ans=y;main=`哥哥今年 ${a} 歲，妹妹今年 ${b} 歲。再過幾年，兩人的年齡加起來是 ${S} 歲？`;exp=`現在合計 ${a+b} 歲，還差 ${S-a-b} 歲。每過一年兩人一共多 2 歲：${S-a-b}÷2＝${ans} 年。`;hint='每過 1 年，兩個人加起來會多幾歲？';sig='ag'+a+b+S}
 else if(kind==='age2'){const m=rand(6,10),k=one([4,5]),T=m*(k+1);ans=m;main=`爸爸的年齡是小明的 ${k} 倍，兩人年齡加起來是 ${T} 歲。小明幾歲？`;exp=`把小明看成 1 份，爸爸是 ${k} 份，一共 ${k+1} 份。${T}÷${k+1}＝${ans} 歲。`;hint='畫線段：小明 1 段，爸爸幾段？';sig='a2'+m+k}
 else if(kind==='sumdiff'){const b=rand(2,12),D=rand(1,7),S=2*b+D;ans=b+D;main=`紅隊和藍隊一共得了 ${S} 分，紅隊比藍隊多 ${D} 分。紅隊得幾分？`;exp=`先把紅隊多的 ${D} 分拿掉：${S}−${D}＝${2*b}，兩隊一樣多，各 ${b} 分；紅隊再加回 ${D}：${ans} 分。`;hint='如果兩隊一樣多，各是幾分？';sig='sd'+S+D}
 else if(kind==='handshake'){const n=rand(3,lv===2?5:7);ans=n*(n-1)/2;main=`${n} 個小朋友見面，每兩個人都要握一次手。一共握了幾次手？`;exp=`第 1 人和其他 ${n-1} 人握，第 2 人再和剩下 ${n-2} 人握……${[...Array(n-1)].map((_,i)=>n-1-i).join('＋')}＝${ans} 次。`;hint='把每個人要握的次數列出來，注意不要重複算。';sig='hs'+n}
 else if(kind==='guess'){const p=guessNumberPuzzle();main=p.main;ans=p.ans;exp=p.exp;hint=p.hint;sig=p.sig}
 else if(kind==='chicken'){const n=rand(5,10),r=rand(1,n-1),f=2*n+2*r;ans=r;main=`籠子裡有雞和兔子共 ${n} 隻，數一數腳一共有 ${f} 隻。兔子有幾隻？`;exp=`假設全部是雞：${n}×2＝${2*n} 隻腳，比實際少 ${f-2*n} 隻。每把一隻雞換成兔子多 2 隻腳：${f-2*n}÷2＝${ans} 隻兔子。`;hint='先假設全部都是雞，腳會少幾隻？';sig='ch'+n+f}
 else if(kind==='times'){const b=rand(2,7),k=rand(2,4),T=b*(k+1);ans=b*k;main=`紅隊的得分是藍隊的 ${k} 倍，兩隊一共得了 ${T} 分。紅隊得幾分？`;exp=`藍隊 1 份、紅隊 ${k} 份，共 ${k+1} 份。每份 ${T}÷${k+1}＝${b} 分，紅隊 ${b}×${k}＝${ans} 分。`;hint='把藍隊看成 1 份。';sig='ti'+b+k}
 else{const n=rand(2,4),x=rand(2,9)*10,w=one([50,100]),T=n*x+w;ans=x;main=`天平左邊放 ${n} 顆一樣重的球和一個 ${w} 克的砝碼，右邊放 ${T} 克的砝碼，剛好平衡。一顆球幾克？`;exp=`${n} 顆球＝${T}−${w}＝${T-w} 克；一顆球 ${T-w}÷${n}＝${ans} 克。`;hint='先把兩邊都拿掉 '+w+' 克。';sig='ba'+n+x+w}
 return {skill:'math-challenge',prompt:'🏆 思考挑戰：先想清楚，再選答案',main,answer:String(ans),choices:choices||choicesForAnswer(ans,lv),explain:exp,hint,signature:'chl-'+sig,concept:'chk-'+kind,reason:true};

function wordUseQuestion(level,used){
  const pool=WORD_USE[level].map((entry,i)=>({entry,i})).filter(x=>!used.has('use-'+level+'-'+x.i));
  const x=one(pool.length?pool:WORD_USE[level].map((entry,i)=>({entry,i})));
  const [sentence,answer,meaning]=x.entry;
  const words=VOCAB[level].map(v=>v[0]).filter(w=>!confusable(w,answer));
  const opts=shuffle([answer,...shuffle(words).slice(0,3)]);
  return {skill:'en-use',prompt:'🗣️ 看懂句子，選出最合適的英文單字',main:sentence,second:'先自己讀英文；真的卡住再看提示裡的中文線索。',answer,choices:opts,explain:sentence.replace('___',answer)+' — '+meaning,hint:'先把整句想成生活畫面。中文線索：'+meaning,signature:'use-'+level+'-'+x.i,concept:'use-'+level+'-'+x.i,isEnglish:true,reason:true};
}

次全懂。</div>':''}${q.hint&&!feedback?`<div class="hint-box"><button type="button" class="hint-toggle" data-action="hint">💭 不知道怎麼開始？看思路提示</button>${session.usedHint?`<p class="hint-text">${h(q.hint)}</p>`:''}</div>`:''}<button type="button" class="hw-quiz-toggle" data-action="quiz-handwrite" aria-expanded="${handQuizOpen}">✍️ ${session.subject==='math'?'手寫計算草稿':session.subject==='english'?'手寫英文草稿':'手寫思考草稿'}　${handQuizOpen?'▲ 收起':'▼ 展開'}（可用手指／Apple Pencil）</button>${handQuizOpen?`<section class="hw-quiz-box">${handPadMarkup('',false,true)}${session.subject==='math'?handRecognizerControls('math'):session.subject==='english'?handRecognizerControls('english'):''}${session.subject==='math'?`<form class="hw-check" data-hw-form="quiz"><div class="hw-field"><label for="hw-check-input">算好後輸入答案驗算</label><input id="hw-check-input" inputmode="decimal" autocomplete="off" placeholder="例如：24" aria-label="輸入計算答案"></div><button class="btn btn-dark" type="submit">✅ 驗算</button></form><div class="hw-message" id="hw-feedback" role="status" aria-live="polite">${h(handResult)}</div>`:''}<p class="hw-note">試用免費本機筆跡辨識；辨識可能有誤，請確認自動填入的答案後，再按核對或驗算。原本的選擇題分數不受影響。</p></section>`:''}<div class="optiongrid ${q.bigChoices?'big':''}" role="group" aria-label="選擇答案">${q.choices.map((o,i)=>{const correct=feedback&&o===q.answer,wrong=feedback&&o===selected&&o!==q.answer;return `<button class="option ${correct?'correct':''} ${wrong?'incorrect':''}" data-action="answer" data-choice="${i}" ${feedback?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${h(o)}</span></button>`}).join('')}</div>${feedback?`<div class="feedback ${feedback.correct?'':'bad'}" role="status"><strong>${feedback.correct?'✅ 答對了！做得好！':'💡 沒關係，我們一起看看'}</strong><p>正確答案：<b>${h(q.answer)}</b><br>${h(q.explain)}</p>${session.mode==='use'?'<button class="speech-test" type="button" data-action="speak-answer">🔊 聽正確單字</button>':''}${q.reviewId?'<p class="auto-next-hint">🔁 複習題：即使答對，也會隔一段時間再複習，確認真的記得。</p>':''}${feedback.correct&&data.settings.autoNext&&!handQuizOpen&&!q.reason&&!q.readingOnly?'<p class="auto-next-hint">⏳ 短暫顯示解析後自動繼續；也可手動按下一題。</p>':(q.reason||q.readingOnly)?'<p class="auto-next-hint">🧠 深度題不自動跳題，請想一想解題思路再繼續。</p>':!feedback.correct?'<p class="auto-next-hint">先看懂解析，再按下一題。</p>':''}</div><button class="btn btn-dark quiz-next" data-action="next">${session.idx===tot-1?'看這回合的練習回顧':'下一題 →'}</button>`:''}</section><p class="mobile-note" style="text-align:center;margin-top:14px">不用搶快。答錯是找出學習方向的重要線索。</p></div>`}
function answer(choiceIndex){clearAdvance();if(!session||feedback)return;const q=session.items[session.idx],sel=q.choices[choiceIndex];if(sel===undefined)return;const ok=sel===q.answer;feedback={selected:sel,correct:ok};chime(ok);if(ok)session.correct++;else session.missed.push({main:q.isListening?q.speech:q.main,answer:q.answer,explain:q.explain});session.attempts.push({skill:q.skill,correct:ok,hintUsed:!!session.usedHint,review:!!q.reviewId,concept:q.concept||'',level:q.reviewLevel||session.level});if(q.reviewId)markReview(q,ok);else if(!ok)newReviewMiss(q,session);save();session.usedHint=false;render();if(ok&&data.settings.autoNext&&!handQuizOpen&&!q.reason&&!q.readingOnly){const currentSession=session,currentFeedback=feedback;advanceTimer=setTimeout(()=>{advanceTimer=null;if(page==='quiz'&&session===currentSession&&feedback===currentFeedback)next()},1600)}}
function next(){clearAdvance();if(!session||!feedback)return;session.idx++;feedback=null;handInk=[];handAnswerInk=[];handOcrResult='';handQuizOpen=false;handResult='';session.usedHint=false;if(session.idx>=session.items.length)finish();else{render();autoReadSoon()}}
function finish(){clearAdvance();const s=session;if(!s)return;const badgesBefore=new Set(earnedBadgeIds());finished={...s};const entry={date:new Date().toISOString(),subject:s.subject,mode:s.mode,level:s.level,total:s.items.length,correct:s.correct,attempts:s.attempts};rememberRound(s);data.sessions.push(entry);data.sessions=data.sessions.slice(-300);save();finished.newBadges=earnedBadgeIds().filter(x=>!badgesBefore.has(x));page='result';session=null;window.scrollTo(0,0);render()}
function result(){if(!finished)return '';const s=finished,tot=s.items.length;const rate=Math.round(100*s.correct/tot),title=rate>=88?'今天完成了一場好練習！':rate>=63?'每一題都在讓你進步！':'錯的題目，就是下一次的起點！';const due=dueReviews(s.subject).length;return `<div class="result"><div class="result-hero"><div class="result-emoji" aria-hidden="true">${rate>=88?'🏆':rate>=63?'⚾':'🌱'}</div><h1>${title}</h1><p>${subName(s.subject)} · 第 ${s.level} 級 · ${MODES[s.subject].find(m=>m.id===s.mode).name}</p><div class="result-score">${s.correct} <span style="font-size:20px">/ ${tot} 題</span></div><p>理解比速度重要；有錯題就透過下次練習慢慢補強。</p></div>${resultBallpark(s)}${s.missed.length?`<section class="card review"><h3>💡 今天可以再想一想的題目</h3><ul style="padding-left:20px">${s.missed.slice(0,4).map(x=>`<li>${h(x.main)}<br><strong>答案：${h(x.answer)}</strong>　${h(x.explain)}</li>`).join('')}</ul><p class="note">答錯題目會加入本機複習清單；如果已關閉複習功能，則只保留本回合的解析。</p></section>`:''}<section class="card reflection"><label for="reflection">💬 用一句話告訴家人：今天我學到……（可不填）</label><textarea id="reflection" maxlength="160" placeholder="例如：我知道 because 表示原因；我會先算總價再找零。"></textarea><div class="rowactions"><button class="btn btn-outline" data-action="save-reflection">儲存小心得</button></div></section><div class="result-buttons">${due?`<button class="btn btn-primary" data-action="review-sub" data-subject="${s.subject}">🔁 立即複習 ${due} 題</button>`:''}<button class="btn btn-dark" data-action="again">再練一次</button><button class="btn btn-outline" data-action="nav-home">回到首頁</button></div></div>`}

function getSkillStat(skill){const attempts=data.sessions.flatMap(s=>Array.isArray(s.attempts)?s.attempts:[]).filter(a=>a.skill===skill);const n=attempts.length,hit=attempts.filter(a=>a.correct).length;return {n,hit,pct:n?Math.round(hit/n*100):0}}
function subjectReport(sub){const x=getSubStats(sub),s=data.sessions.filter(x=>x.subject===sub),recent=s.slice(-4),rAcc=recent.length?Math.round(recent.reduce((a,x)=>a+x.correct,0)/recent.reduce((a,x)=>a+x.total,0)*100):null;return `<div style="display:flex;justify-content:space-between;gap:10px"><strong style="font-size:18px">${SUBJECT_META[sub].icon+' '+SUBJECT_META[sub].name}</strong><span class="tag">難度 ${data.settings[sub]}</span></div><div class="statrow" style="margin-top:14px"><div class="stat"><strong>${x.num}</strong><small>已完成回合</small></div><div class="stat"><strong>${rAcc===null?'—':rAcc+'%'}</strong><small>近4回合正確率</small></div></div>${recent.length?`<p class="note">${recent.length<2?'目前資料很少，先累積幾次練習。':recent.filter(x=>x.correct>=7).length>=2?'近4回合至少兩回合答對7題以上，可考慮先觀察孩子解題過程，再試進階。':'練習時可優先複習答錯的概念，不必急著升級。'}</p>`:`<p class="note">還沒有練習紀錄。先從基礎級玩一回合吧。</p>`}`}
function parent(){if(!parentUnlocked)return parentGate();const ss=data.sessions.slice(-8).reverse();const w=Object.values(SKILL_GROUPS).flat();const weakest=w.map(k=>({k,...getSkillStat(k)})).filter(x=>x.n>=5).sort((a,b)=>a.pct-b.pct).slice(0,2);return `<div class="pageheading"><div class="eyebrow">PARENT COACH CENTER</div><h1>📋 家長陪練中心</h1><p style="margin:2px 0 8px"><span class="pill">目前查看：${activeProfile().avatar} ${h(activeProfile().name)} · ${GRADES[grade()]}</span></p><p>讓孩子保有棒球熱情，也把英數與生活能力慢慢練起來。</p></div><div class="parent-banner">🔒 <b>隱私說明：</b>這是單機試作版，不需要帳號，不會上傳學習紀錄。家長區設有本機密碼，可阻止孩子誤入，但無法取代正式帳號與伺服器權限管理。</div><div class="parent-grid">${SUBJECT_KEYS.map(sb=>`<section class="card"><h3>${subName(sb)}進度</h3>${subjectReport(sb)}</section>`).join('')}</div>
<div class="section-title"><div><h2>各項練習能力</h2><p>以練習題答對比例估算，不能當作正式能力鑑定。</p></div></div><div class="parent-grid">${SUBJECT_KEYS.map(sb=>`<section class="card"><h3>${SUBJECT_META[sb].icon} ${subName(sb)}能力</h3>${SKILL_GROUPS[sb].map(skillMeter).join('')}</section>`).join('')}</div>
<div class="section-title"><div><h2>個人化複習排程</h2><p>答錯先加入清單；答對後於1、3、7天再複習，逐步鞏固理解。這是設計規則，不是教育成效保證。</p></div></div><section class="card"><div class="statrow"><div class="stat"><strong>${data.reviewQueue.length}</strong><small>待鞏固概念</small></div><div class="stat"><strong>${dueReviews().length}</strong><small>目前可複習</small></div></div><div class="rowactions" style="margin-top:13px">${SUBJECT_KEYS.map(sb=>dueReviews(sb).length?`<button class="btn btn-outline" data-action="review-sub" data-subject="${sb}">${subName(sb)}複習 ${dueReviews(sb).length} 題</button>`:'').join('')}</div><p class="note">複習清單存在本機；答錯後可以當天再挑戰，接著按間隔安排下一次。大人應一起確認解題過程，不只看正確率。</p></section><div class="section-title"><div><h2>每週陪伴建議</h2><p>把練習學到的東西用回生活，比多刷幾題更重要。</p></div></div><div class="two-col"><section class="card"><h3>🏡 本週家中任務</h3><div class="mini-plan"><b>英文：</b>先認 3 個大小寫字母並聽發音，再找家裡 1 個物品學英文名稱。<br><b>數學：</b>去超市時請孩子估算 2～3 件商品的總價，再核對結果。<br><b>表達：</b>請孩子解釋一題他算對或算錯的題目，重點是「怎麼想」。<br><b>自主管理：</b>自己檢查球具與隔天上學用品。</div><p class="note">上面的生活任務是家長可自行調整的建議，不是標準化教育測驗。</p></section><section class="card"><h3>🧭 需要多一點陪練的地方</h3>${weakest.length?weakest.map(x=>`<p class="note">• <strong>${SKILLS[x.k]}</strong>：目前 ${x.hit}/${x.n} 題正確，適合一起回顧錯題與概念。</p>`).join(''):'<div class="empty">各項能力至少練過 5 題後，這裡才會提示值得複習的領域。</div>'}<div class="wellbeing" style="margin-top:16px">🌿 孩子疲倦、挫折或不想練時，可以直接結束，不用補做或追進度。</div></section></div>

<div class="section-title"><div><h2>答題節奏</h2><p>答對給短暫回饋、答錯保留解析，避免為了過關而忽略理解。</p></div></div><section class="card"><div class="settings-row"><label for="auto-next-toggle">答對自動下一題<small>答對約 1.6 秒後自動繼續；答錯必須手動閱讀解析再繼續。</small></label><input type="checkbox" id="auto-next-toggle" data-action="auto-next" ${data.settings.autoNext?'checked':''} style="width:24px;height:24px;accent-color:#1b9277"/></div><p class="note">建議：保留正確答案的簡短提示。數學應用題若需要時間理解，也可以關閉自動切題。</p></section>

function playSavedAudio(url,label,rate=null,repeat=1){
  stopEnglish();
  const id=speechAttempt;
  const audio=new Audio();activeRecordedAudio=audio;
  audio.preload='auto';audio.src=url;
  audio.playbackRate=rate??SPEEDS[voicePrefs.speed];
  // Keep the same pitch when a child slows the recording down; supported in modern Safari.
  if('preservesPitch' in audio)audio.preservesPitch=true;
  let remaining=repeat;
  audio.onplaying=()=>{if(id===speechAttempt)showSpeechStatus('🔊 播放：'+label)};
  audio.onended=()=>{if(id!==speechAttempt)return;
    if(--remaining>0){
      // Keep a real pause between the two *whole words*. Otherwise iPhone replay sounds glued together.
      showSpeechStatus('👂 停頓一下，再聽第二次；可以跟著念。');
      wordReplayTimer=setTimeout(()=>{
        wordReplayTimer=null;
        if(id!==speechAttempt || activeRecordedAudio!==audio)return;
        try{audio.currentTime=0;const next=audio.play();if(next?.catch)next.catch(fail)}catch(_){fail()}
      },780);
      return;
    }
    activeRecordedAudio=null;showSpeechStatus('✅ 播放完成，可以再按一次重聽。');
  };
  function fail(){if(id!==speechAttempt)return;activeRecordedAudio=null;if(url.includes('/audio/letters/')){showSpeechStatus('⚠️ 字母音檔暫時無法播放，請稍後重新按播放鍵。');return;}showSpeechStatus('⚠️ 音檔無法播放；改用手機的預設語音。');playSyntheticEnglish(label)}
  audio.onerror=fail;
  try{const p=audio.play();if(p?.catch)p.catch(fail)}catch(_){fail()}
  showSpeechStatus('🔊 正在載入發音…');
  return true;
}

function playDeviceEnglish(text,rate=null,repeat=1,fallbackUrl=null){
  const value=String(text||'').trim();

    if(fallbackUrl)return playSavedAudio(fallbackUrl,value,rate,repeat);
    showSpeechStatus('⚠️ 這台裝置沒有可用的英文語音。');return false;
  }
  stopEnglish();
  const id=speechAttempt;
  const synth=window.speechSynthesis;
  const selected=pickEnglishVoice();
  let index=0,started=false,fellBack=false;
  function fail(reason){
    if(id!==speechAttempt||fellBack)return;
    fellBack=true;clearTimeout(voiceHealthTimer);
    if(fallbackUrl){showSpeechStatus('⚠️ 內建英文語音未啟動，改用原本音檔。');playSavedAudio(fallbackUrl,value,rate,repeat)}

      const fullPhrase=isEnglishSentence(value)?value.replace(/\s+/g,' ').trim():value;

      if(selected)u.voice=selected;

      u.pitch=1;u.volume=1;
      speechActive=u;
      u.onstart=()=>{if(id===speechAttempt){started=true;clearTimeout(voiceHealthTimer);showSpeechStatus('🔊 美式英文：'+value+(repeat>1?'（第 '+(index+1)+' 次）':''))}};
      u.onend=()=>{
        if(id!==speechAttempt||fellBack)return;
        clearTimeout(voiceHealthTimer);speechActive=null;
        index++;

          showSpeechStatus('⏸️ 中間停頓一秒，準備再唸一次。');
          wordReplayTimer=setTimeout(()=>{wordReplayTimer=null;begin()},1100);

      };

app.addEventListener('change',async e=>{const el=e.target;if(el.id!=='import-file'||!parentUnlocked)return;const file=el.files?.[0];if(!file)return;try{if(file.size>2_000_000)throw new Error('檔案超過2MB');const obj=JSON.parse(await file.text());if(obj.app!=='全壘打雙軌學院'||!Array.isArray(obj.sessions)||!Array.isArray(obj.reflections)||!obj.settings)throw new Error('格式不符');if(!confirm('匯入會取代這台裝置目前的紀錄。確定要繼續嗎？'))return;const sessions=obj.sessions.slice(-300).map(cleanHistorySession).filter(Boolean);const reflections=obj.reflections.slice(-100).map(cleanHistoryReflection).filter(Boolean);data={settings:normalizeSettings(obj.settings),sessions,reflections,reviewQueue:sanitizeReviewQueue(obj.reviewQueue),recent:cleanRecent(obj.recent)};save();render();toast('練習紀錄已匯入。')}catch(err){toast('無法匯入：'+err.message)}finally{el.value=''}});

app.addEventListener('change',e=>{const x=e.target;if(x.dataset.action==='review-enabled'){if(!parentUnlocked)return;data.settings.reviewEnabled=x.checked;save();render();toast(x.checked?'已開啟複習排程':'已暫停複習排程（原紀錄仍保存）');return}if(x.dataset.action==='auto-next'){if(!parentUnlocked){toast('請先解鎖家長區。');return}data.settings.autoNext=x.checked;save();toast(x.checked?'已開啟：答對自動下一題':'已關閉：每題都手動按下一題');return}if(x.dataset.action==='zh-voice'){try{localStorage.setItem(VOICE_PREF_KEY,x.value)}catch(_){}speakChinese('這是新的朗讀聲音');return}if(x.dataset.action==='round-size'){if(!parentUnlocked)return;data.settings.roundSize=Number(x.value)||8;save();toast('每回合 '+data.settings.roundSize+' 題');return}if(x.dataset.action==='auto-read'||x.dataset.action==='sound'){if(!parentUnlocked)return;data.settings[x.dataset.action==='auto-read'?'autoRead':'sound']=x.checked;save();toast(x.checked?'已開啟':'已關閉');return}if(x.dataset.action!=='level')return;const sub=x.dataset.subject,lv=Number(x.value);if(!parentUnlocked||!SUBJECT_KEYS.includes(sub)||![1,2,3].includes(lv))return;data.settings[sub]=lv;save();render();toast('已調整'+subName(sub)+'難度為第 '+lv+' 級。')});
