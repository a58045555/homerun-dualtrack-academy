<script>
(function(){
  function issue(label, detail){
    var app=document.getElementById('app');
    if(!app)return;
    // Do not interrupt a correctly rendered homepage or an active lesson for an unrelated error.
    if(app.querySelector('.shell') && app.querySelector('.hero'))return;
    if(!app.querySelector('#boot-fallback') && app.textContent.trim().length>160)return;
    var el=document.getElementById('boot-problem');
    if(el){el.textContent='開啟時遇到相容性問題（'+label+'）。請嘗試 Safari 重新開啟；資料未被清除。';}
  }
  window.addEventListener('error',function(e){issue('啟動錯誤',e.message)},false);
  window.addEventListener('unhandledrejection',function(e){issue('啟動中斷',String(e.reason||''))},false);
  if(typeof window.structuredClone!=='function'){
    window.structuredClone=function(value){return JSON.parse(JSON.stringify(value))};
  }
})();
</script>
